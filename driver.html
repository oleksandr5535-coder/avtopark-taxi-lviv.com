:root{--ink:#0F1B2D;--surface:#fff;--bg:#F5F7FB;--text:#16202E;--muted:#6A7686;--line:#E6EBF2;--lamp:#FFB100;--lamp-deep:#E89E00;--money:#13986A;--danger:#D6453B;--radius:16px;--shadow:0 1px 2px rgba(16,27,45,.04),0 8px 24px rgba(16,27,45,.06)}

body{font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;min-height:100dvh}
.num{font-family:"Space Grotesk",sans-serif;font-feature-settings:"tnum" 1}

button{font-family:inherit;cursor:pointer;border:none}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#FBFCFE;margin-bottom:14px;outline:none;min-width:0}

.btn.sm{width:auto;padding:8px 14px;font-size:13px}
.btn.red{background:var(--danger);color:#fff}
.btn.grn{background:var(--money);color:#fff}
.err{background:#FDECEA;color:#9d2a22;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
.ok{background:#E6F6EF;color:#0b6b4a;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px}
#auth{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(130% 90% at 50% -20%,#20365a 0,transparent 55%),var(--ink)}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}

.auth-card h1{font-family:"Space Grotesk";font-size:21px;margin-bottom:4px}

header.top{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header.top .who{margin-left:auto;font-size:13px;opacity:.85;text-align:right}
header.top button{background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:6px 10px;font-size:12px}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;position:sticky;top:50px;z-index:4}
nav.tabs button{background:none;padding:13px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-color:var(--lamp)}
main{max-width:560px;margin:0 auto;padding:16px 14px 80px}
h2{font-family:"Space Grotesk";font-size:17px;margin:0 0 10px}
.big{font-family:"Space Grotesk";font-size:34px;font-weight:700;color:var(--money)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);gap:10px;font-size:14px}
.row:last-child{border:none}
.muted{color:var(--muted);font-size:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:#EEF2F8}
.pill.g{background:#E6F6EF;color:#0b6b4a}.pill.r{background:#FDECEA;color:#9d2a22}.pill.y{background:#FFF3D6;color:#8a5a00}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wk{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}

.tbl{width:100%;border-collapse:collapse;font-size:13px}

.tblwrap{overflow-x:auto}.tbl .num{white-space:nowrap}
.seg{display:flex;gap:8px;margin-bottom:14px}

@media(min-width:900px){
 main.wide{max-width:1180px}
 .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
}
header.top{} .embed header.top{display:none}.embed nav.tabs{top:0}

 <nav class="tabs" id="tabs"></nav>
 <main id="view"></main>

<script>
// ====================== ДОПОМІЖНЕ ======================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(Number(n)||0).toLocaleString('uk-UA').replace(/ /g,' ') + ' ₴';
const DAYS = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dm = s => { const d = parse(s); return pad(d.getDate())+'.'+pad(d.getMonth()+1); };
function mondayOf(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function weekDays(off){ const m = addDays(mondayOf(new Date()), off*7); return Array.from({length:7},(_,i)=>ymd(addDays(m,i))); }
const dayName = s => DAYS[parse(s).getDay()];
const todayStr = () => ymd(new Date());

const EMBED = (function(){try{return window.self !== window.top;}catch(e){return true;}})();
if (EMBED) document.documentElement.classList.add('embed');
let db, me = null, S = {};   // S = стан застосунку
const defaultSettings = {wash_week:300};
// Шкали виплати за літерами (відсоток залежить від денного обороту водія). Менеджер міняє їх у вкладці «Умови».
const PLAN_DEF = {
  'Б':{lt1:1875,p1:50,lt2:2375,p2:55,p3:60},
  'Г':{lt1:2850,p1:45,lt2:3300,p2:50,p3:55},
  'Н':{lt1:2850,p1:40,lt2:3350,p2:45,p3:50}
};
const PLAN_NAMES = {'Б':'Бензин','Г':'Гібрид','Н':'Гібрид (нові умови)'};
const LAT2LET = {B:'Б',G:'Г',H:'Н'};
function planOfLetter(letter, st){
  const L = PLAN_DEF[letter] ? letter : (LAT2LET[String(letter).toUpperCase()] || 'Г');
  const d = PLAN_DEF[L], o = {};
  ['lt1','p1','lt2','p2','p3'].forEach(k => { const v = st && st['plan:'+L+':'+k]; o[k] = (v==null || isNaN(v)) ? d[k] : +v; });
  return o;
}
// відсоток за добу: чим більший оборот дня, тим вищий відсоток
function dayPct(letter, gross, st){
  if (!(gross > 0)) return 0;
  const p = planOfLetter(letter, st);
  return gross < p.lt1 ? p.p1 : gross < p.lt2 ? p.p2 : p.p3;
}
function nextTier(letter, gross, st){
  const p = planOfLetter(letter, st);
  if (gross < p.lt1) return {pct:p.p1, next:p.p2, need:p.lt1-gross};
  if (gross < p.lt2) return {pct:p.p2, next:p.p3, need:p.lt2-gross};
  return null;
}
const letterOf = did => ((S.drivers||[]).find(d=>d.id===did)||{}).plan_letter || 'Г';

// ====================== РОЗРАХУНОК ======================
// Виплата = сума по днях (оборот дня × відсоток за шкалою літери водія) + повернення за мийку (до ліміту на тиждень).
// Паливо на водієві; страховку не утримуємо.
function repGross(r){ return (+r.bolt||0)+(+r.uklon||0)+(+r.other||0); }
function weekCalc(reps, st, letter){
  st = Object.assign({}, defaultSettings, st||{});
  const gross = reps.reduce((a,r)=>a+repGross(r),0);
  const share = reps.reduce((a,r)=>a+repGross(r)*dayPct(letter, repGross(r), st)/100, 0);
  const pct = gross > 0 ? Math.round(share/gross*1000)/10 : 0;   // середній відсоток за тиждень
  const washSpent = reps.reduce((a,r)=>a+(+r.wash||0),0);
  const washBack = Math.min(washSpent, st.wash_week);
  return {gross, pct, share, washBack, total: share+washBack, days: reps.length,
          bolt: reps.reduce((a,r)=>a+(+r.bolt||0),0), uklon: reps.reduce((a,r)=>a+(+r.uklon||0),0),
          other: reps.reduce((a,r)=>a+(+r.other||0),0)};
}

// Ефективні цифри дня: система (API) має пріоритет; водій подає свій варіант, якщо не збігається;
// менеджер може прийняти варіант водія. Якщо даних системи нема — беремо звіт водія.
const DIFF = 50;
function effDay(did, date){
  const a = (S.apiMap||{})[did+'|'+date];
  const r = S.reports.find(x => x.driver_id===did && x.report_date===date);
  if (!a && !r) return null;
  let bolt, uklon, src;
  if (r && (!a || r.accepted)) { bolt = a && !(+r.bolt>0) ? (+a.bolt_net||0) : (+r.bolt||0); uklon = a && !(+r.uklon>0) ? (+a.uklon_net||0) : (+r.uklon||0); src = a ? 'accepted' : 'driver'; }
  else { bolt = +a.bolt_net||0; uklon = +a.uklon_net||0; src = 'api'; }
  const diff = !!(a && r && !r.accepted && (((+r.bolt||0)>0 && Math.abs((+r.bolt||0)-(+a.bolt_net||0))>DIFF) || ((+r.uklon||0)>0 && Math.abs((+r.uklon||0)-(+a.uklon_net||0))>DIFF)));
  return { report_date:date, bolt, uklon, other: r?(+r.other||0):0, wash: r?(+r.wash||0):0, src, diff, api:a||null, rep:r||null };
}
const effReps = (did, days) => days.map(d => effDay(did,d)).filter(Boolean);
const SRC = { api:['з системи','g'], driver:['ваші дані, чекають перевірки','y'], accepted:['прийнято менеджером','g'] };
const srcPill = e => e.diff ? '<span class="pill r">розбіжність: враховано дані системи</span>' : `<span class="pill ${SRC[e.src][1]}">${SRC[e.src][0]}</span>`;
const debtBalance = list => (list||[]).reduce((a,d)=>a+(d.kind==='charge'?+d.amount:-d.amount),0);

// ====================== ВХІД ======================
let regMode = false;
function showOnly(id){ for (const x of ['auth','pending','app']) $('#'+x).classList.toggle('hidden', x!==id); }
function setAuthMode(reg){
  regMode = reg;
  $('#regFields').classList.toggle('hidden', !reg);
  $('#fName').required = reg; $('#fPhone').required = reg;
  $('#authTitle').textContent = reg ? 'Реєстрація водія' : 'Вхід';
  $('#authHint').textContent = reg ? 'Заповніть дані — менеджер підтвердить доступ' : 'Кабінет водія AVTO PARK';
  $('#authBtn').textContent = reg ? 'Надіслати заявку' : 'Увійти';
  $('#fPass').autocomplete = reg ? 'new-password' : 'current-password';
  $('#authToggle').classList.toggle('hidden', EMBED);
  $('#authToggle').innerHTML = reg ? 'Вже є акаунт? <a id="tg">Увійти</a>' : 'Вперше? <a id="tg">Зареєструватися як водій</a>';
  $('#tg').onclick = () => { $('#authMsg').innerHTML=''; setAuthMode(!regMode); };
}
const authMsg = (t,ok) => $('#authMsg').innerHTML = t ? `<div class="${ok?'ok':'err'}">${esc(t)}</div>` : '';
const niceErr = m => ({ 'Invalid login credentials':'Невірний email або пароль',
  'User already registered':'Цей email уже зареєстровано — натисніть «Увійти»',
  'Email not confirmed':'Email не підтверджено — перевірте пошту' }[m] || m);

$('#authForm').addEventListener('submit', async e => {
  e.preventDefault(); authMsg(''); $('#authBtn').disabled = true;
  const email = $('#fEmail').value.trim(), password = $('#fPass').value;
  try {
    if (regMode) {
      const full_name = $('#fName').value.trim(), phone = $('#fPhone').value.trim();
      const {data, error} = await db.auth.signUp({email, password, options:{data:{full_name, phone}}});
      if (error) throw error;
      if (!data.session) { authMsg('Лист підтвердження надіслано на пошту. Підтвердіть email і увійдіть.', true); setAuthMode(false); }
      else await boot();
    } else {
      const {error} = await db.auth.signInWithPassword({email, password});
      if (error) throw error;
      await boot();
    }
  } catch (err) { authMsg(niceErr(err.message)); }
  $('#authBtn').disabled = false;
});
async function logout(){ await db.auth.signOut(); me = null; S = {}; showOnly('auth'); setAuthMode(false); }
$('#outBtn').onclick = logout; $('#pendOut').onclick = logout; $('#pendRefresh').onclick = () => boot();

async function boot(){
  // Усередині дашборда вхід один: беремо сесію дашборда (той самий сайт), окремого входу немає.
  if (EMBED) {
    try {
      const ps = await window.parent.__dashSupa.auth.getSession();
      const t = ps && ps.data && ps.data.session;
      if (t) {
        const cur = (await db.auth.getSession()).data.session;
        if (!cur || cur.user.id !== t.user.id) await db.auth.setSession({access_token:t.access_token, refresh_token:t.refresh_token});
      }
    } catch (e) { /* дашборд недоступний — спробуємо власну сесію */ }
  }
  const {data:{session}} = await db.auth.getSession();
  if (!session && EMBED) {
    $('#pendTitle').textContent = 'Потрібен вхід у дашборд';
    $('#pendText').textContent = 'Увійдіть у дашборд своєю поштою менеджера, потім знову відкрийте цю вкладку.';
    showOnly('pending'); return;
  }
  if (!session) { showOnly('auth'); setAuthMode(false); return; }
  const {data:p, error} = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !p) { showOnly('auth'); authMsg('Профіль не знайдено. Зверніться до менеджера.'); return; }
  me = p;
  if (p.status === 'pending') { $('#pendTitle').textContent='Заявку надіслано'; $('#pendText').textContent='Менеджер перевірить дані й підтвердить доступ. Зайдіть пізніше.'; showOnly('pending'); return; }
  if (p.status === 'rejected') { $('#pendTitle').textContent='Доступ не надано'; $('#pendText').textContent='Зверніться до менеджера парку.'; showOnly('pending'); return; }
  const staff = p.role === 'owner' || p.role === 'manager';
  if (EMBED && !staff) {
    $('#pendTitle').textContent = 'Тут увійшов водій: ' + (p.full_name || session.user.email);
    $('#pendText').textContent = 'У цьому браузері відкрита сесія водія, тому панель менеджера прихована. Натисніть «Вийти» і увійдіть своєю поштою менеджера. Водія перевіряйте у вікні інкогніто.';
    showOnly('pending'); return;
  }
  $('#whoName').textContent = p.full_name || session.user.email;
  showOnly('app');
  S.staff = staff; $('#dashLink').classList.toggle('hidden', !staff); S.week = 0; S.tab = staff ? 'm_over' : 'd_week';
  S.repDate = todayStr();
  $('#view').className = staff ? 'wide' : '';
  buildTabs(); await load(); render();
}
function buildTabs(){
  const t = S.staff
    ? [['m_over','Огляд'],['m_rep','Звіти'],['m_drv','Водії'],['m_cars','Парк'],['m_inc','ДТП'],['m_set','Умови']]
    : [['d_week','Тиждень'],['d_rep','Звіт'],['d_car','Авто'],['d_inc','ДТП']];
  $('#tabs').innerHTML = t.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
  $('#tabs').onclick = e => { const k = e.target.dataset.k; if (k) { S.tab = k; if (k!=='d_rep') S.repFor = null; render(); window.scrollTo(0,0); } };
}

// ====================== ЗАВАНТАЖЕННЯ ======================
async function load(){
  const q = (p) => p.then(r => { if (r.error) throw r.error; return r.data || []; });
  const since = ymd(addDays(new Date(), -120));
  const [settings, reports, incidents, cars, debts, apiRows] = await Promise.all([
    q(db.from('settings').select('*')),
    q(db.from('reports').select('*').gte('report_date', since).order('report_date',{ascending:false}).limit(5000)),
    q(db.from('incidents').select('*').order('created_at',{ascending:false}).limit(500)),
    q(db.from('cars').select('*').order('plate')),
    q(db.from('debts').select('*').order('created_at',{ascending:false}).limit(2000)),
    q(db.from('api_days').select('*').gte('day', since).limit(20000)).catch(() => [])
  ]);
  S.apiMap = Object.fromEntries(apiRows.map(a => [a.driver_id+'|'+a.day, a]));
  S.settings = Object.assign({}, defaultSettings, Object.fromEntries(settings.map(s=>[s.key,+s.value])));
  S.reports = reports; S.incidents = incidents; S.cars = cars; S.debts = debts;
  if (S.staff) {
    const [drivers, profiles] = await Promise.all([
      q(db.from('drivers').select('*').order('full_name')),
      q(db.from('profiles').select('*').order('created_at',{ascending:false}))
    ]);
    S.drivers = drivers; S.profiles = profiles;
    try { S.dashNames = await loadDashNames(); } catch(e) { S.dashNames = []; }
  }
}

// Імена водіїв з дашборду (останній день у app_data) — для вибору при підтвердженні
async function loadDashNames(){
  const k = await db.from('app_data').select('key').like('key','day:%').order('key',{ascending:false}).limit(1);
  if (k.error || !k.data || !k.data.length) return [];
  const r = await db.from('app_data').select('value').eq('key', k.data[0].key).maybeSingle();
  const parts = r.data && r.data.value && r.data.value._parts; if (!parts) return [];
  const names = new Set();
  Object.values(parts).forEach(arr => Array.isArray(arr) && arr.forEach(row => { const n = row && row['Водій']; if (n) names.add(String(n).trim()); }));
  return [...names].sort();
}

// Імпорт авто з дашборду: kv:fleet (текст, номер на рядок) або номери з останнього дня
const LAT2CYR = {A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',I:'І'};
const normPlate = v => String(v||'').toUpperCase().replace(/[\s\-]/g,'').replace(/[A-Z]/g, c => LAT2CYR[c] || c);
async function dashPlates(){
  const out = new Set();
  const f = await db.from('app_data').select('value').eq('key','kv:fleet').maybeSingle();
  const v = f.data && f.data.value;
  if (typeof v === 'string') v.split(/[\n,;]+/).forEach(x => x.trim() && out.add(normPlate(x)));
  else if (Array.isArray(v)) v.forEach(x => out.add(normPlate(x)));
  if (!out.size) {
    const k = await db.from('app_data').select('key').like('key','day:%').order('key',{ascending:false}).limit(1);
    if (k.data && k.data.length) {
      const r = await db.from('app_data').select('value').eq('key',k.data[0].key).maybeSingle();
      const parts = r.data && r.data.value && r.data.value._parts || {};
      Object.values(parts).forEach(arr => Array.isArray(arr) && arr.forEach(row => { if (!row) return;
        ['Номерний знак','Держ номер авто'].forEach(c => row[c] && out.add(normPlate(row[c]))); }));
    }
  }
  return [...out];
}

function weekNav(el, cb){
  const days = weekDays(S.week);
  const box = document.createElement('div'); box.className='wk';
  box.innerHTML = `<button data-d="-1">‹</button><b class="num">${dm(days[0])} – ${dm(days[6])}${S.week===0?' · цей тиждень':''}</b><button data-d="1" ${S.week>=0?'disabled':''}>›</button>`;
  box.onclick = e => { const d = e.target.dataset.d; if (d) { S.week += +d; cb(); } };
  el.appendChild(box); return days;
}

      ${r?`<div class="row"><span>Км (по бордюрах)</span><b>${r.km??'—'} (${r.curb_km??'—'})</b></div>
      <div class="row"><span>Поїздок</span><b>${r.trips??'—'}</b></div>
      <div class="row"><span>Мийка</span><b>${money(r.wash)}</b></div>
      <div class="row"><span>План 12 год</span><b>${r.plan12?'так':'ні'}</b></div>${r.plan_comment?`<div class="muted">Пояснення: ${esc(r.plan_comment)}</div>`:''}
      <div class="row"><span>Вихідний / вихід завтра</span><b>${esc(r.dayoff_note||'—')} / ${esc(r.next_start||'—')}</b></div>

// ---------- МЕНЕДЖЕР: ВОДІЇ ----------
m_drv(el){
  const list = S.drivers.slice().sort((a,b)=>(a.status==='archived')-(b.status==='archived') || a.full_name.localeCompare(b.full_name));
  const hasAcc = id => S.profiles.find(x=>x.driver_id===id);
  el.innerHTML = `<div id="dmsg"></div>
   <div class="card"><h2>Додати водія в базу</h2>
    <div class="two"><div><label>Прізвище та ім'я</label><input id="nName"></div><div><label>Телефон</label><input id="nPhone" type="tel"></div></div>
    <div class="two"><div><label>Ім'я в дашборді</label><input id="nDash" list="dnames"></div><div><label>Літера</label><select id="nLet"><option>Б</option><option selected>Г</option><option>Н</option></select></div></div>
    <datalist id="dnames">${(S.dashNames||[]).map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <button class="btn" id="nAdd">Додати водія</button>
    <div class="muted" style="margin-top:6px">Картка створюється одразу. Коли водій сам зареєструється, у «Огляді» вкажіть цю картку у списку «нова картка» і підтвердьте: акаунт прив'яжеться до неї.</div></div>
   ${S.cars.length?'':'<div class="err">Спершу додайте авто у вкладці «Парк» (є кнопка імпорту з дашборду).</div>'}<div class="cols">` + list.map(dr=>{
    const car = carOf(dr.id); const ds = S.debts.filter(d=>d.driver_id===dr.id); const bal = debtBalance(ds);
    const free = S.cars.filter(c=>!c.driver_id || c.driver_id===dr.id); const acc = hasAcc(dr.id); const arch = dr.status==='archived';
    return `<div class="card" style="${arch?'opacity:.6':''}"><h2>${esc(dr.full_name)} <span class="pill ${arch?'':'g'}">${arch?'архів':'активний'}</span> <span class="pill ${acc?'g':'y'}">${acc?'є акаунт':'без акаунта'}</span></h2>
     <div class="muted" style="margin-bottom:10px">${esc(dr.phone||'')}${dr.dash_name?` · у дашборді: ${esc(dr.dash_name)}`:''}</div>
     <label>Авто</label><select data-car="${dr.id}"><option value="">— без авто —</option>${free.map(c=>`<option value="${c.id}" ${car?.id===c.id?'selected':''}>${esc(c.plate)} ${esc(c.model||'')}</option>`).join('')}</select>
     <label>Літера розрахунку (Б/Г/Н)</label><select data-letter="${dr.id}">${['Б','Г','Н'].map(l=>`<option ${dr.plan_letter===l?'selected':''}>${l}</option>`).join('')}</select>
     <div class="row"><span>Борг</span><b style="color:${bal>0?'var(--danger)':'var(--money)'}">${money(bal)}</b></div>
     ${ds.slice(0,4).map(d=>`<div class="row" style="font-size:12px"><span>${dm(d.created_at.slice(0,10))} ${d.kind==='charge'?'+':'−'}${money(d.amount)}${d.note?` · ${esc(d.note)}`:''}</span><a data-deldebt="${d.id}" style="cursor:pointer;color:var(--danger)">✕</a></div>`).join('')}
     <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="btn sm sec" data-debt="${dr.id}|charge">+ Нарахувати</button><button class="btn sm sec" data-debt="${dr.id}|payment">+ Оплата</button></div>
     <div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px"><button class="btn sm sec" data-edit="${dr.id}">Змінити дані</button><button class="btn sm sec" data-arch="${dr.id}">${arch?'Відновити':'В архів'}</button><button class="btn sm red" data-deldr="${dr.id}">Видалити</button></div></div>`;
  }).join('') + (list.length?'':'<div class="card muted">Водіїв ще немає. Додайте вище або підтвердьте заявку в «Огляді».</div>') + `</div>`;
  const msg = (t,ok) => { $('#dmsg').innerHTML = `<div class="${ok?'ok':'err'}">${esc(t)}</div>`; window.scrollTo(0,0); };
  $('#nAdd').onclick = async () => {
    const full_name = $('#nName').value.trim(); if (!full_name) return msg("Вкажіть прізвище та ім'я");
    const r = await db.from('drivers').insert({full_name, phone:$('#nPhone').value.trim()||null, dash_name:$('#nDash').value.trim()||null, plan_letter:$('#nLet').value});
    if (r.error) return msg(r.error.message); await load(); render();
  };
  el.onchange = async e => {
    const t = e.target;
    if (t.dataset.car !== undefined) {
      const did = t.dataset.car;
      let r = await db.from('cars').update({driver_id:null}).eq('driver_id', did); if (r.error) return msg(r.error.message);
      if (t.value) { r = await db.from('cars').update({driver_id:did}).eq('id', t.value); if (r.error) return msg(r.error.message); }
      await load(); render();
    }
    if (t.dataset.letter) { const r = await db.from('drivers').update({plan_letter:t.value}).eq('id',t.dataset.letter); if (r.error) return msg(r.error.message); await load(); }
  };
  el.onclick = async e => {
    const b = e.target;
    if (b.dataset.debt) { const [id,kind] = b.dataset.debt.split('|');
      const a = parseFloat((prompt(kind==='charge'?'Сума боргу, ₴':'Сума оплати, ₴')||'').replace(',','.')); if (!(a>0)) return;
      const note = prompt('Коментар (за що)')||null;
      const r = await db.from('debts').insert({driver_id:id,kind,amount:a,note}); if (r.error) return msg(r.error.message); await load(); render(); }
    if (b.dataset.deldebt) { if (!confirm('Видалити цей запис боргу?')) return; const r = await db.from('debts').delete().eq('id', b.dataset.deldebt); if (r.error) return msg(r.error.message); await load(); render(); }
    if (b.dataset.edit) { const dr = S.drivers.find(d=>d.id===b.dataset.edit);
      const n = prompt("Прізвище та ім'я", dr.full_name); if (n===null) return; const ph = prompt('Телефон', dr.phone||''); if (ph===null) return; const dn = prompt("Ім'я в дашборді", dr.dash_name||''); if (dn===null) return;
      const r = await db.from('drivers').update({full_name:n.trim()||dr.full_name, phone:ph.trim()||null, dash_name:dn.trim()||null}).eq('id',dr.id); if (r.error) return msg(r.error.message); await load(); render(); }
    if (b.dataset.arch) { const dr = S.drivers.find(d=>d.id===b.dataset.arch); const to = dr.status==='archived'?'active':'archived';
      if (to==='archived' && !confirm('Перенести в архів? Водій втратить доступ до кабінету, а звіти збережуться.')) return;
      let r = await db.from('drivers').update({status:to}).eq('id',dr.id); if (r.error) return msg(r.error.message);
      r = await db.from('profiles').update({status: to==='archived'?'rejected':'active'}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message);
      if (to==='archived') { r = await db.from('cars').update({driver_id:null}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message); }
      await load(); render(); }
    if (b.dataset.deldr) { const dr = S.drivers.find(d=>d.id===b.dataset.deldr);
      if (!confirm(`Видалити водія «${dr.full_name}» НАЗАВЖДИ разом з усіма його звітами, боргами й ДТП?\nЦе не можна скасувати. Якщо сумніваєтесь, оберіть «В архів».`)) return;
      let r = await db.from('profiles').update({status:'rejected'}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message);
      r = await db.from('drivers').delete().eq('id',dr.id); if (r.error) return msg(r.error.message); await load(); render(); }
  };
},

// ---------- МЕНЕДЖЕР: ПАРК ----------
m_cars(el){
  el.innerHTML = `<div class="cols"><div class="card"><h2>Додати авто</h2><div id="cmsg"></div>
   <label>Номер</label><input id="cPlate" placeholder="ВС0000АА"><label>Марка / модель</label><input id="cModel">
   <label>Паливо</label><select id="cFuel"><option value="hybrid">Гібрид</option><option value="petrol">Бензин</option><option value="gas">Газ</option></select>
   <label>Страховка до</label><input id="cIns" type="date"><label>Техогляд до</label><input id="cTech" type="date"><label>Ліцензія до</label><input id="cLic" type="date">
   <button class="btn" id="cAdd">Додати</button>
   <hr style="border:none;border-top:1px solid var(--line);margin:18px 0"><button class="btn sec" id="cImp">Імпортувати номери з дашборду</button><div class="muted" style="margin-top:6px">Додасть номери авто, яких ще немає. Модель, паливо й терміни документів вкажете потім.</div></div>
   <div>${S.cars.map(c=>{const dr=S.drivers.find(d=>d.id===c.driver_id); return `<div class="card"><h2>${esc(c.plate)} <span class="muted">${esc(c.model||'')}</span></h2>
    <div class="muted">${esc(c.fuel_type)} · водій: ${dr?esc(dr.full_name):'не призначено'} <a data-delcar="${c.id}" style="cursor:pointer;color:var(--danger);margin-left:8px">видалити авто</a></div>
    <div class="two" style="margin-top:10px"><div><label>Страховка</label><input type="date" data-cf="insurance_until|${c.id}" value="${c.insurance_until||''}"></div>
    <div><label>Техогляд</label><input type="date" data-cf="techpass_until|${c.id}" value="${c.techpass_until||''}"></div></div>
    <label>Ліцензія</label><input type="date" data-cf="license_until|${c.id}" value="${c.license_until||''}"></div>`;}).join('')}</div></div>`;
  $('#cImp').onclick = async () => {
    $('#cImp').disabled = true;
    try {
      const plates = await dashPlates();
      const ok = p => /^[А-ЯІЇЄ]{2}\d{4}[А-ЯІЇЄ]{2}$/.test(p);
      const have = new Set(S.cars.map(c => normPlate(c.plate)));
      const add = plates.filter(p => ok(p) && !have.has(p)), bad = plates.filter(p => !ok(p));
      if (add.length) { const r = await db.from('cars').insert(add.map(plate => ({plate}))); if (r.error) throw r.error; }
      await load(); render();
      $('#cmsg').innerHTML = `<div class="ok">Додано авто: ${add.length}${bad.length?`. Пропущено (незвичний формат): ${esc(bad.join(', '))}`:''}${!plates.length?'. У дашборді не знайшов номерів — додайте вручну':''}</div>`;
    } catch (e) { $('#cmsg').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
    $('#cImp').disabled = false;
  };
  $('#cAdd').onclick = async () => { const plate = $('#cPlate').value.trim().toUpperCase().replace(/\s+/g,''); if (!plate) return;
    const r = await db.from('cars').insert({plate, model:$('#cModel').value.trim()||null, fuel_type:$('#cFuel').value,
      insurance_until:$('#cIns').value||null, techpass_until:$('#cTech').value||null, license_until:$('#cLic').value||null});
    if (r.error) return $('#cmsg').innerHTML = `<div class="err">${esc(r.error.message)}</div>`; await load(); render(); };
  el.onclick = async e => { const id = e.target.dataset.delcar; if (!id) return; const c = S.cars.find(x=>x.id===id);
    if (!confirm(`Видалити авто ${c.plate}?`)) return; const r = await db.from('cars').delete().eq('id',id); if (r.error) return alert(r.error.message); await load(); render(); };
  el.onchange = async e => { const v = e.target.dataset.cf; if (!v) return; const [f,id] = v.split('|');
    const r = await db.from('cars').update({[f]: e.target.value||null}).eq('id',id); if (r.error) alert(r.error.message); else await load(); };
},

// ---------- МЕНЕДЖЕР: УМОВИ ----------
m_set(el){
  const s = S.settings;
  const numIn = (k,v,w) => `<input inputmode="decimal" data-sk="${k}" value="${v}" style="width:${w||88}px;margin:0;display:inline-block;text-align:right">`;
  const block = L => { const p = planOfLetter(L, s); return `<div style="border-top:1px solid var(--line);padding:12px 0">
    <b>Літера ${L}</b> <span class="muted">· ${PLAN_NAMES[L]||''}</span>
    <div class="row"><span>оборот за день до ${numIn('plan:'+L+':lt1',p.lt1)} ₴</span><span>${numIn('plan:'+L+':p1',p.p1,60)} %</span></div>
    <div class="row"><span>від того до ${numIn('plan:'+L+':lt2',p.lt2)} ₴</span><span>${numIn('plan:'+L+':p2',p.p2,60)} %</span></div>
    <div class="row"><span>далі, від другої суми</span><span>${numIn('plan:'+L+':p3',p.p3,60)} %</span></div></div>`; };
  el.innerHTML = `<div class="card"><h2>Умови виплат</h2><div id="smsg"></div>
   <div class="muted">Відсоток водія залежить від його літери (Б / Г / Н) і від обороту за день. Літеру водія ви ставите в його картці у «Водії». Зміни застосовуються одразу, для всіх тижнів.</div>
   ${['Б','Г','Н'].map(block).join('')}
   <div style="border-top:1px solid var(--line);padding:12px 0"><b>Мийка</b><div class="row"><span>повернення за мийку на тиждень, ₴</span><span>${numIn('wash_week',s.wash_week,88)}</span></div></div>
   <button class="btn" id="sSave">Зберегти</button></div>`;
  $('#sSave').onclick = async () => { const rows = [...el.querySelectorAll('[data-sk]')].map(i=>({key:i.dataset.sk, value: parseFloat(String(i.value).replace(',','.'))}));
    if (rows.some(r=>isNaN(r.value)||r.value<0)) return $('#smsg').innerHTML='<div class="err">Лише числа від 0</div>';
    for (const L of ['Б','Г','Н']) { const g = k => rows.find(r=>r.key==='plan:'+L+':'+k).value;
      if (g('lt1') >= g('lt2')) return $('#smsg').innerHTML=`<div class="err">Літера ${L}: перша сума має бути меншою за другу</div>`;
      if (g('p1') > 100 || g('p2') > 100 || g('p3') > 100) return $('#smsg').innerHTML=`<div class="err">Літера ${L}: відсоток не може бути більше 100</div>`; }
    const r = await db.from('settings').upsert(rows,{onConflict:'key'}); if (r.error) return $('#smsg').innerHTML=`<div class="err">${esc(r.error.message)}</div>`;
    await load(); $('#smsg').innerHTML='<div class="ok">Збережено</div>'; };
}
};

// ---------- ДТП: форма + список (водій) ----------
function incidentForm(el, driverId, list){
  el.innerHTML = `<div class="card"><h2>Повідомити про подію</h2><div id="imsg"></div>
   <div class="seg" id="iKind"><button type="button" data-v="dtp" class="on">ДТП</button><button type="button" data-v="self_damage">Самостійне пошкодження</button></div>
   <label>Де сталось</label><input id="iLoc"><label>Що сталось</label><textarea id="iDesc"></textarea>
   <label>Фото / відео</label><input id="iFiles" type="file" accept="image/*,video/*" multiple capture="environment">
   <button class="btn" id="iSend">Надіслати</button></div>
   <div class="card"><h2>Мої звернення</h2>${list.map(i=>`<div class="row"><div><b>${i.kind==='self_damage'?'Самост. пошкодження':'ДТП'}</b><div class="muted">${i.created_at.slice(0,10)} · ${esc(i.location||'')}</div></div><span class="pill">${esc(i.status)}</span></div>`).join('') || '<div class="muted">Звернень немає</div>'}</div>`;
  let kind = 'dtp';
  $('#iKind').onclick = e => { const v = e.target.dataset.v; if (!v) return; kind = v; document.querySelectorAll('#iKind button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); };
  $('#iSend').onclick = async () => {
    const m = (t,ok) => $('#imsg').innerHTML = `<div class="${ok?'ok':'err'}">${esc(t)}</div>`;
    const desc = $('#iDesc').value.trim(); if (!desc) return m('Опишіть, що сталось');
    $('#iSend').disabled = true;
    const {data:inc, error} = await db.from('incidents').insert({driver_id:driverId, kind, location:$('#iLoc').value.trim()||null, description:desc, occurred_at:new Date().toISOString()}).select().single();
    if (error) { $('#iSend').disabled=false; return m('Помилка: '+error.message); }
    let fail = 0;
    for (const f of $('#iFiles').files) {
      const path = `${driverId}/${inc.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
      const up = await db.storage.from('incident-media').upload(path, f);
      if (up.error) { fail++; continue; }
      await db.from('incident_media').insert({incident_id:inc.id, driver_id:driverId, storage_path:path, kind:f.type.startsWith('video')?'video':'photo'});
    }
    await load(); render(); $('#imsg').innerHTML = `<div class="${fail?'err':'ok'}">${fail?`Звернення надіслано, але ${fail} файл(ів) не завантажилось`:'Звернення надіслано менеджеру'}</div>`;
  };
}
