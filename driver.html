<script>
// ====================== ДОПОМІЖНЕ ======================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Math.round(Number(n)||0).toLocaleString('uk-UA').replace(/ /g,' ') + ' ₴';
const DAYS = ['Нд','Пн','Вт','Ср','Чт','Пт','Сб'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const dm = s => { const d = parse(s); return pad(d.getDate())+'.'+pad(d.getMonth()+1); };
function mondayOf(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function weekDays(off){ const m = addDays(mondayOf(new Date()), off*7); return Array.from({length:7},(_,i)=>ymd(addDays(m,i))); }
const dayName = s => DAYS[parse(s).getDay()];
const todayStr = () => ymd(new Date());

const EMBED = (function(){try{return window.self !== window.top;}catch(e){return true;}})();
if (EMBED) document.documentElement.classList.add('embed');
// Тема як у дашборді (світла/темна). У вкладці дашборда стежимо за його темою, окремо — за збереженою.
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t==='dark' ? 'dark' : 'light'); }
(function(){
  let t = null;
  try { t = EMBED ? window.parent.document.documentElement.getAttribute('data-theme') : null; } catch(e){}
  if (!t) { try { t = localStorage.getItem('theme'); } catch(e){} }
  applyTheme(t);
  if (EMBED) { try { new MutationObserver(() => applyTheme(window.parent.document.documentElement.getAttribute('data-theme'))).observe(window.parent.document.documentElement,{attributes:true,attributeFilter:['data-theme']}); } catch(e){} }
})();
let db, me = null, S = {};   // S = стан застосунку
const defaultSettings = {wash_week:300};
// Плани виплати (літера → шкала). Кожен план: період рахунку («за добу» або «за тиждень») і сходинки «від суми → %».
// Сходинка діє, коли оборот ≥ її «від». Менеджер додає/міняє плани у вкладці «Умови» (таблиця pay_plans).
const PLAN_DEFAULTS = [
  {code:'Б', name:'Бензин',              period:'day', tiers:[{from:0,pct:50},{from:1875,pct:55},{from:2375,pct:60}]},
  {code:'Г', name:'Гібрид',              period:'day', tiers:[{from:0,pct:45},{from:2850,pct:50},{from:3300,pct:55}]},
  {code:'Н', name:'Гібрид (нові умови)', period:'day', tiers:[{from:0,pct:40},{from:2850,pct:45},{from:3350,pct:50}]}
];
const LAT2LET = {B:'Б',G:'Г',H:'Н'};
const plansList = () => (S.plans && S.plans.length) ? S.plans : PLAN_DEFAULTS;
function planByCode(code){
  if (!code) return {code:'', name:'без плану', period:'day', tiers:[]};
  const L = plansList();
  return L.find(p=>p.code===code) || L.find(p=>p.code===LAT2LET[String(code).toUpperCase()]) || L.find(p=>p.code==='Г') || L[0];
}
function tierPct(plan, base){
  if (!(base > 0)) return 0;
  const t = (plan.tiers||[]).slice().sort((x,y)=>x.from-y.from);
  let pct = t.length ? t[0].pct : 0;
  for (const x of t) if (base >= x.from) pct = x.pct;
  return pct;
}
function tierNext(plan, base){
  const t = (plan.tiers||[]).slice().sort((x,y)=>x.from-y.from);
  const nx = t.find(x => x.from > base);
  return nx ? {pct:nx.pct, need:nx.from-base} : null;
}
const dayPct = (code, gross) => tierPct(planByCode(code), gross);
const letterOf = did => ((S.drivers||[]).find(d=>d.id===did)||{}).plan_letter || null;

function repGross(r){ return (+r.bolt||0)+(+r.uklon||0)+(+r.other||0); }
function weekCalc(reps, st, letter){
  st = Object.assign({}, defaultSettings, st||{});
  const noPlan = !letter;
  const plan = noPlan ? {period:'day', tiers:[]} : planByCode(letter);
  const gross = reps.reduce((a,r)=>a+repGross(r),0);
  const share = plan.period === 'week'
    ? gross * tierPct(plan, gross) / 100
    : reps.reduce((a,r)=>a+repGross(r)*tierPct(plan, repGross(r))/100, 0);
  const pct = gross > 0 ? Math.round(share/gross*1000)/10 : 0;   // середній відсоток за тиждень
  const washSpent = reps.reduce((a,r)=>a+(+r.wash||0),0);
  const washBack = Math.min(washSpent, st.wash_week);
  return {noPlan, gross, pct, share, washBack, total: noPlan ? 0 : share+washBack, days: reps.length,
          bolt: reps.reduce((a,r)=>a+(+r.bolt||0),0), uklon: reps.reduce((a,r)=>a+(+r.uklon||0),0),
          other: reps.reduce((a,r)=>a+(+r.other||0),0)};
}

// Ефективні цифри дня: система (API) має пріоритет; водій подає свій варіант, якщо не збігається;
// менеджер може прийняти варіант водія. Якщо даних системи нема — беремо звіт водія.
const DIFF = 50;
function effDay(did, date){
  const a = (S.apiMap||{})[did+'|'+date];
  const r = S.reports.find(x => x.driver_id===did && x.report_date===date);
  if (!a && !r) return null;
  let bolt, uklon, src;
  if (r && (!a || r.accepted)) { bolt = a && !(+r.bolt>0) ? (+a.bolt_net||0) : (+r.bolt||0); uklon = a && !(+r.uklon>0) ? (+a.uklon_net||0) : (+r.uklon||0); src = a ? 'accepted' : 'driver'; }
  else { bolt = +a.bolt_net||0; uklon = +a.uklon_net||0; src = 'api'; }
  const diff = !!(a && r && !r.accepted && (((+r.bolt||0)>0 && Math.abs((+r.bolt||0)-(+a.bolt_net||0))>DIFF) || ((+r.uklon||0)>0 && Math.abs((+r.uklon||0)-(+a.uklon_net||0))>DIFF)));
  return { report_date:date, bolt, uklon, other: r?(+r.other||0):0, wash: r?(+r.wash||0):0, src, diff, api:a||null, rep:r||null };
}
const effReps = (did, days) => days.map(d => effDay(did,d)).filter(Boolean);
const SRC = { api:['з системи','g'], driver:['ваші дані, чекають перевірки','y'], accepted:['прийнято менеджером','g'] };
const srcPill = e => e.diff ? '<span class="pill r">розбіжність: враховано дані системи</span>' : `<span class="pill ${SRC[e.src][1]}">${SRC[e.src][0]}</span>`;
const debtBalance = list => (list||[]).reduce((a,d)=>a+(d.kind==='charge'?+d.amount:-d.amount),0);

// ====================== ВХІД ======================
let regMode = false, recovering = false;
function showOnly(id){ for (const x of ['auth','pending','recov','app']) $('#'+x).classList.toggle('hidden', x!==id); }
function setAuthMode(reg){
  regMode = reg;
  $('#regFields').classList.toggle('hidden', !reg);
  $('#fName').required = reg; $('#fPhone').required = reg;
  $('#authTitle').textContent = reg ? 'Реєстрація водія' : 'Вхід';
  $('#authHint').textContent = reg ? 'Заповніть дані — менеджер підтвердить доступ' : 'Кабінет водія AVTO PARK';
  $('#authBtn').textContent = reg ? 'Надіслати заявку' : 'Увійти';
  $('#fPass').autocomplete = reg ? 'new-password' : 'current-password';
  $('#authToggle').classList.toggle('hidden', EMBED);
  $('#forgotBox').classList.toggle('hidden', EMBED || reg);
  $('#authToggle').innerHTML = reg ? 'Вже є акаунт? <a id="tg">Увійти</a>' : 'Вперше? <a id="tg">Зареєструватися як водій</a>';
  $('#tg').onclick = () => { $('#authMsg').innerHTML=''; setAuthMode(!regMode); };
}
const authMsg = (t,ok) => $('#authMsg').innerHTML = t ? `<div class="${ok?'ok':'err'}">${esc(t)}</div>` : '';
const niceErr = m => ({ 'Invalid login credentials':'Невірний email або пароль',
  'User already registered':'Цей email уже зареєстровано — натисніть «Увійти»',
  'Email not confirmed':'Email не підтверджено — перевірте пошту' }[m] || m);

$('#authForm').addEventListener('submit', async e => {
  e.preventDefault(); authMsg(''); $('#authBtn').disabled = true;
  const email = $('#fEmail').value.trim(), password = $('#fPass').value;
  try {
    if (regMode) {
      const full_name = $('#fName').value.trim(), phone = $('#fPhone').value.trim();
      const {data, error} = await db.auth.signUp({email, password, options:{data:{full_name, phone}}});
      if (error) throw error;
      if (!data.session) { authMsg('Лист підтвердження надіслано на пошту. Підтвердіть email і увійдіть.', true); setAuthMode(false); }
      else await boot();
    } else {
      const {error} = await db.auth.signInWithPassword({email, password});
      if (error) throw error;
      await boot();
    }
  } catch (err) { authMsg(niceErr(err.message)); }
  $('#authBtn').disabled = false;
});
$('#forgot').onclick = async () => {
  authMsg(''); const email = $('#fEmail').value.trim();
  if (!email) { authMsg('Спочатку впишіть свій email у поле вище, потім натисніть «Забули пароль?»'); return; }
  const {error} = await db.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
  if (error) { authMsg(/rate|seconds/i.test(error.message) ? 'Забагато спроб. Зачекайте хвилину і спробуйте ще раз.' : niceErr(error.message)); return; }
  authMsg('Якщо такий email є в системі — на нього надіслано лист із посиланням для нового пароля. Перевірте також «Спам».', true);
};
$('#recForm').addEventListener('submit', async e => {
  e.preventDefault(); const a=$('#rPass').value, b=$('#rPass2').value, m=$('#recMsg');
  if (a!==b) { m.innerHTML='<div class="err">Паролі не збігаються</div>'; return; }
  $('#recBtn').disabled = true;
  const {error} = await db.auth.updateUser({password:a});
  $('#recBtn').disabled = false;
  if (error) { m.innerHTML='<div class="err">'+esc(error.message)+'</div>'; return; }
  recovering = false; history.replaceState(null,'',location.pathname); await boot();
});
async function logout(){ await db.auth.signOut(); me = null; S = {}; showOnly('auth'); setAuthMode(false); }
$('#outBtn').onclick = logout; $('#pendOut').onclick = logout; $('#pendRefresh').onclick = () => boot();

async function boot(){
  if (recovering) { showOnly('recov'); return; }
  // Усередині дашборда вхід один: беремо сесію дашборда (той самий сайт), окремого входу немає.
  if (EMBED) {
    try {
      const ps = await window.parent.__dashSupa.auth.getSession();
      const t = ps && ps.data && ps.data.session;
      if (t) {
        const cur = (await db.auth.getSession()).data.session;
        if (!cur || cur.user.id !== t.user.id) await db.auth.setSession({access_token:t.access_token, refresh_token:t.refresh_token});
      }
    } catch (e) { /* дашборд недоступний — спробуємо власну сесію */ }
  }
  const {data:{session}} = await db.auth.getSession();
  if (!session && EMBED) {
    $('#pendTitle').textContent = 'Потрібен вхід у дашборд';
    $('#pendText').textContent = 'Увійдіть у дашборд своєю поштою менеджера, потім знову відкрийте цю вкладку.';
    showOnly('pending'); return;
  }
  if (!session) { showOnly('auth'); setAuthMode(false); return; }
  const {data:p, error} = await db.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  if (error || !p) { showOnly('auth'); authMsg('Профіль не знайдено. Зверніться до менеджера.'); return; }
  me = p;
  if (p.status === 'pending') { $('#pendTitle').textContent='Заявку надіслано'; $('#pendText').textContent='Менеджер перевірить дані й підтвердить доступ. Зайдіть пізніше.'; showOnly('pending'); return; }
  if (p.status === 'rejected') { $('#pendTitle').textContent='Доступ не надано'; $('#pendText').textContent='Зверніться до менеджера парку.'; showOnly('pending'); return; }
  const staff = p.role === 'owner' || p.role === 'manager';
  if (EMBED && !staff) {
    $('#pendTitle').textContent = 'Тут увійшов водій: ' + (p.full_name || session.user.email);
    $('#pendText').textContent = 'У цьому браузері відкрита сесія водія, тому панель менеджера прихована. Натисніть «Вийти» і увійдіть своєю поштою менеджера. Водія перевіряйте у вікні інкогніто.';
    showOnly('pending'); return;
  }
  $('#whoName').textContent = p.full_name || session.user.email;
  showOnly('app');
  S.staff = staff; $('#dashLink').classList.toggle('hidden', !staff); S.week = 0; S.tab = staff ? 'm_today' : 'd_week'; $('#app').classList.toggle('staff', staff);
  S.repDate = todayStr();
  $('#mainBox').className = staff ? 'wide' : '';
  buildTabs(); await load(); render();
}
function buildTabs(){
  const t = S.staff
    ? [['m_today','☀️ Сьогодні'],['m_drv','👥 Водії'],['m_cars','🚗 Парк'],['m_rep','📋 Звіти'],['m_pay','💳 Виплати'],['m_inc','⚠️ ДТП'],['m_docs','📅 Документи'],['m_set','⚙️ Умови']]
    : [['d_week','💰 Тиждень'],['d_rep','📝 Звіт'],['d_car','🚗 Авто'],['d_inc','⚠️ ДТП']];
  $('#tabs').innerHTML = (EMBED ? '<button class="exitdash" id="exitDash" title="Повернутись до дашборду парку">← До дашборду</button>' : '') + t.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join('');
  const ex = $('#exitDash'); if (ex) ex.onclick = () => { try { window.parent.postMessage({cabinetExit:true}, '*'); } catch(e){} };
  $('#tabs').onclick = e => { const bt = e.target.closest('button[data-k]'); const k = bt && bt.dataset.k; if (k) { S.tab = k; if (k!=='d_rep') S.repFor = null; if (k==='m_drv') S.drvOpen = null; render(); window.scrollTo(0,0); } };
}

// ====================== ЗАВАНТАЖЕННЯ ======================
async function load(){
  const q = (p) => p.then(r => { if (r.error) throw r.error; return r.data || []; });
  const since = ymd(addDays(new Date(), -120));
  const [settings, reports, incidents, cars, debts, apiRows, plansRows, payRows, mediaRows, brandRows] = await Promise.all([
    q(db.from('settings').select('*')),
    q(db.from('reports').select('*').gte('report_date', since).order('report_date',{ascending:false}).limit(5000)),
    q(db.from('incidents').select('*').order('created_at',{ascending:false}).limit(500)),
    q(db.from('cars').select('*').order('plate')),
    q(db.from('debts').select('*').order('created_at',{ascending:false}).limit(2000)),
    q(db.from('api_days').select('*').gte('day', since).limit(20000)).catch(() => []),
    q(db.from('pay_plans').select('*').order('code')).catch(() => null),
    q(db.from('payouts').select('*').limit(5000)).catch(() => null),
    q(db.from('incident_media').select('*').order('created_at').limit(3000)).catch(() => []),
    q(db.from('brand_weeks').select('*').limit(5000)).catch(() => null)
  ]);
  S.brandMissing = brandRows === null;
  S.brandMap = Object.fromEntries((brandRows||[]).map(b => [b.driver_id+'|'+String(b.week_start).slice(0,10), b]));
  S.brandWeeks = new Set((brandRows||[]).map(b => String(b.week_start).slice(0,10)));
  S.media = {}; (mediaRows||[]).forEach(m => (S.media[m.incident_id] = S.media[m.incident_id] || []).push(m));
  S.payMissing = payRows === null;
  S.payouts = Object.fromEntries((payRows||[]).map(p => [p.driver_id+'|'+String(p.week_start).slice(0,10), p]));
  S.plansMissing = plansRows === null;
  S.plans = (plansRows||[]).map(p => ({code:p.code, name:p.name||'', period:p.period==='week'?'week':'day', tiers:(Array.isArray(p.tiers)?p.tiers:[]).map(t=>({from:+t.from||0,pct:+t.pct||0}))}));
  S.apiMap = Object.fromEntries(apiRows.map(a => [a.driver_id+'|'+a.day, a]));
  S.settings = Object.assign({}, defaultSettings, Object.fromEntries(settings.map(s=>[s.key,+s.value])));
  S.reports = reports; S.incidents = incidents; S.cars = cars; S.debts = debts;
  if (S.staff) {
    const [drivers, profiles] = await Promise.all([
      q(db.from('drivers').select('*').order('full_name')),
      q(db.from('profiles').select('*').order('created_at',{ascending:false}))
    ]);
    S.drivers = drivers; S.profiles = profiles;
    try { S.dashNames = await loadDashNames(); } catch(e) { S.dashNames = []; }
  } else if (me && me.driver_id) {
    // водій бачить лише свій рядок (RLS) — потрібен для його літери-плану
    S.drivers = await q(db.from('drivers').select('*').eq('id', me.driver_id)).catch(() => []);
  }
}

// Імена водіїв з дашборду (останній день у app_data) — для вибору при підтвердженні
async function loadDashNames(){
  const k = await db.from('app_data').select('key').like('key','day:%').order('key',{ascending:false}).limit(1);
  if (k.error || !k.data || !k.data.length) return [];
  const r = await db.from('app_data').select('value').eq('key', k.data[0].key).maybeSingle();
  const parts = r.data && r.data.value && r.data.value._parts; if (!parts) return [];
  const names = new Set();
  Object.values(parts).forEach(arr => Array.isArray(arr) && arr.forEach(row => { const n = row && row['Водій']; if (n) names.add(String(n).trim()); }));
  return [...names].sort();
}

// Імпорт авто з дашборду: kv:fleet (текст, номер на рядок) або номери з останнього дня
const LAT2CYR = {A:'А',B:'В',C:'С',E:'Е',H:'Н',K:'К',M:'М',O:'О',P:'Р',T:'Т',X:'Х',I:'І'};
const normPlate = v => String(v||'').toUpperCase().replace(/[\s\-]/g,'').replace(/[A-Z]/g, c => LAT2CYR[c] || c);
async function dashPlates(){
  const out = new Set();
  const f = await db.from('app_data').select('value').eq('key','kv:fleet').maybeSingle();
  const v = f.data && f.data.value;
  if (typeof v === 'string') v.split(/[\n,;]+/).forEach(x => x.trim() && out.add(normPlate(x)));
  else if (Array.isArray(v)) v.forEach(x => out.add(normPlate(x)));
  if (!out.size) {
    const k = await db.from('app_data').select('key').like('key','day:%').order('key',{ascending:false}).limit(1);
    if (k.data && k.data.length) {
      const r = await db.from('app_data').select('value').eq('key',k.data[0].key).maybeSingle();
      const parts = r.data && r.data.value && r.data.value._parts || {};
      Object.values(parts).forEach(arr => Array.isArray(arr) && arr.forEach(row => { if (!row) return;
        ['Номерний знак','Держ номер авто'].forEach(c => row[c] && out.add(normPlate(row[c]))); }));
    }
  }
  return [...out];
}

const DOCS = [['insurance_until','Страховка'],['techpass_until','Техогляд'],['license_until','Ліцензія']];
const daysLeft = d => Math.round((parse(d) - parse(todayStr())) / 86400000);
function docItems(){ const out = []; S.cars.forEach(c => DOCS.forEach(([f,l]) => out.push({car:c, f, label:l, date:c[f]||null, left:c[f]?daysLeft(c[f]):null}))); return out; }
const docPill = left => left==null ? '<span class="pill">не вказано</span>' : left<0 ? `<span class="pill r">прострочено ${-left} дн</span>` : left<=30 ? `<span class="pill y">лишилось ${left} дн</span>` : `<span class="pill g">${left} дн</span>`;
const fmtDate = s => { const d = parse(String(s).slice(0,10)); return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear(); };
function weekRow(dr, days){ const reps = effReps(dr.id, days); return {reps, w: weekCalc(reps, S.settings, dr.plan_letter)}; }
const planLabel = dr => { if (!dr.plan_letter) return '⚠ без плану'; const p = planByCode(dr.plan_letter); return `${dr.plan_letter} · ${p.period==='week'?'тиждень':'доба'}`; };
const payoutOf = (did, ws) => (S.payouts||{})[did+'|'+ws] || null;
// Брендування: авто-сума з дашборда (вже з 50%) або ручна правка менеджера; skip = «не платити»
const brandLoaded = ws => !S.brandMissing && !!(S.brandWeeks && S.brandWeeks.has(ws));
function brandOf(did, ws){
  const r = (S.brandMap||{})[did+'|'+ws];
  if (!r) return {row:null, auto:0, manual:null, skip:false, eff:0, note:'', plate:'', paid:false, pct:null};
  const manual = r.manual_amount==null ? null : +r.manual_amount, auto = +r.auto_amount || 0, skip = !!r.skip;
  return {row:r, auto, manual, skip, eff: skip ? 0 : (manual!=null ? manual : auto), note:r.note||'', plate:r.plate||'', paid:!!r.paid_at, pct:r.pct};
}
const brandPill = b => b.skip ? '<span class="pill y">не платимо</span>' : (b.manual!=null ? '<span class="pill">вручну</span>' : (b.eff>0 ? '<span class="pill g">авто</span>' : ''));

async function appsClick(e, say){
  const a = e.target.dataset.ap, r = e.target.dataset.rj, q = (k,id)=>(document.querySelector(`[data-${k}="${id}"]`)||{}).value||'';
  if (a) {
    const letter = q('apl',a), car = q('apc',a), dn = q('apd',a).trim(), lk = q('apk',a);
    if (!letter && !lk) return say('Оберіть літеру: за нею рахуватиметься виплата водія');
    if (!car && !confirm('Авто не вибрано. Підтвердити водія без авто? (авто можна призначити пізніше в картці водія)')) return;
    e.target.disabled = true;
    const {data:did, error} = await db.rpc('approve_driver',{p_profile:a,p_dash_name:dn||null,p_driver_id:lk||null});
    if (error) { e.target.disabled=false; return say(error.message); }
    if (letter) { const u = await db.from('drivers').update({plan_letter:letter}).eq('id',did); if (u.error) return say('Підтверджено, але літеру не збережено: '+u.error.message); }
    if (car) { const u = await db.from('cars').update({driver_id:did}).eq('id',car); if (u.error) return say('Підтверджено, але авто не призначено: '+u.error.message); }
    await load(); S.drvOpen = did; render(); window.scrollTo(0,0); return true;
  }
  if (r) { if(!confirm('Відхилити заявку?')) return; const {error} = await db.from('profiles').update({status:'rejected'}).eq('id',r); if (error) return say(error.message); await load(); render(); return true; }
}

// Картка водія: усе про одного водія в одному місці
function drvCard(el, dr){
  const car = carOf(dr.id), ds = S.debts.filter(x=>x.driver_id===dr.id), bal = debtBalance(ds), acc = S.profiles.find(x=>x.driver_id===dr.id), arch = dr.status==='archived';
  const dossier = 'tax_id' in dr;
  const hist = Array.from({length:8},(_,i)=>{ const days = weekDays(-i); const r = weekRow(dr,days); const br = brandLoaded(days[0]) ? brandOf(dr.id,days[0]) : null; return {days, w:r.w, po:payoutOf(dr.id,days[0]), br}; });
  const cur = hist[0].w;
  const last30 = effReps(dr.id, Array.from({length:30},(_,i)=>ymd(addDays(new Date(),-i))));
  const avgDay = last30.length ? last30.reduce((a,r)=>a+repGross(r),0)/last30.length : 0;

     ${ds.slice(0,8).map(d=>`<div class="row" style="font-size:12px"><span>${dm(d.created_at.slice(0,10))} ${d.kind==='charge'?'+':'−'}${money(d.amount)}${d.note?` · ${esc(d.note)}`:''}</span><a data-deldebt="${d.id}" style="cursor:pointer;color:var(--bad)">✕</a></div>`).join('')}

   </div></div>`;

    const t = e.target;
    if (t.dataset.car !== undefined) {
      let r = await db.from('cars').update({driver_id:null}).eq('driver_id', dr.id); if (r.error) return msg(r.error.message);
      if (t.value) { r = await db.from('cars').update({driver_id:dr.id}).eq('id', t.value); if (r.error) return msg(r.error.message); }
      await load(); render();
    }
  };
  el.onclick = async e => {
    const b = e.target;
    if (b.dataset.back) { S.drvOpen = null; render(); window.scrollTo(0,0); return; }
    if (b.id==='dSave') {
      const upd = {full_name:$('#fN').value.trim()||dr.full_name, phone:$('#fP').value.trim()||null, dash_name:$('#fD').value.trim()||null, plan_letter:$('#fL').value||null};
      if (dossier) Object.assign(upd, {tax_id:$('#fT').value.trim()||null, passport:$('#fPass').value.trim()||null, license_no:$('#fLn').value.trim()||null, license_until:$('#fLu').value||null, address:$('#fA').value.trim()||null, notes:$('#fNote').value.trim()||null});

      await load(); render(); $('#dmsg').innerHTML = '<div class="ok">Збережено</div>'; return; }
    if (b.dataset.addrep) { S.repFor = dr.id; S.repDate = todayStr(); S.tab = 'd_rep'; render(); window.scrollTo(0,0); return; }
    if (b.dataset.debt) { const [id,kind] = b.dataset.debt.split('|');
      const a = parseFloat((prompt(kind==='charge'?'Сума боргу, ₴':'Сума оплати, ₴')||'').replace(',','.')); if (!(a>0)) return;
      const note = prompt('Коментар (за що)')||null;
      const r = await db.from('debts').insert({driver_id:id,kind,amount:a,note}); if (r.error) return msg(r.error.message); await load(); render(); return; }
    if (b.dataset.deldebt) { if (!confirm('Видалити цей запис боргу?')) return; const r = await db.from('debts').delete().eq('id', b.dataset.deldebt); if (r.error) return msg(r.error.message); await load(); render(); return; }
    if (b.dataset.arch) { const to = dr.status==='archived'?'active':'archived';
      if (to==='archived' && !confirm('Перенести в архів? Водій втратить доступ до кабінету, а звіти збережуться.')) return;
      let r = await db.from('drivers').update({status:to}).eq('id',dr.id); if (r.error) return msg(r.error.message);
      r = await db.from('profiles').update({status: to==='archived'?'rejected':'active'}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message);
      if (to==='archived') { r = await db.from('cars').update({driver_id:null}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message); }
      await load(); render(); return; }
    if (b.dataset.deldr) {
      if (!confirm(`Видалити водія «${dr.full_name}» НАЗАВЖДИ разом з усіма його звітами, боргами й ДТП?\nЦе не можна скасувати. Якщо сумніваєтесь, оберіть «В архів».`)) return;
      let r = await db.from('profiles').update({status:'rejected'}).eq('driver_id',dr.id); if (r.error) return msg(r.error.message);
      r = await db.from('drivers').delete().eq('id',dr.id); if (r.error) return msg(r.error.message); S.drvOpen = null; await load(); render(); }
  };
}

    ${(!S.brandMissing && !brandLoaded(days[0]) && days[6] < todayStr()) ? '<div class="muted" style="margin-top:6px">Брендування за цей тиждень буде додано після завантаження даних менеджером.</div>' : ''}

      <div style="text-align:right">${e?`<b class="num">${money(repGross(e)*(PL.period==='week'?w.pct:dayPct(LET,repGross(e)))/100)}</b><div class="muted">${PL.period==='week'?w.pct:dayPct(LET,repGross(e))}% від ${money(repGross(e))}</div>${(PL.period!=='week' && i===lastI && tierNext(PL,repGross(e)))?`<div class="muted">до ${tierNext(PL,repGross(e)).pct}%: ще ${money(tierNext(PL,repGross(e)).need)}</div>`:''}`:(isFuture?'<span class="muted">—</span>':'')}

  const apiRow = (S.apiMap||{})[RD()+'|'+cur];

   <div><label>Uklon, ₴ ${apiRow?'(якщо відрізняється)':''}</label><input id="rUklon" inputmode="decimal" placeholder="${apiRow?Math.round(apiRow.uklon_net):'0'}" value="${r.uklon||''}"></div></div>

   <div><label>Кількість поїздок</label><input id="rTrips" inputmode="numeric" value="${r.trips??''}"></div></div>
   <label>Витрати на мийку, ₴ (якщо були)</label><input id="rWash" inputmode="decimal" placeholder="0" value="${r.wash||''}">

   <div class="seg" id="pSeg"><button type="button" data-v="1" class="${r.plan12===true?'on':''}">Так</button><button type="button" data-v="0" class="${r.plan12===false?'on':''}">Ні</button></div>
   <div id="pcBox" class="${r.plan12===false?'':'hidden'}"><label>Чому не виконано? (обов'язково)</label><textarea id="rPC">${esc(r.plan_comment||'')}</textarea></div>
   <label>Вихідний (дата або «без змін»)</label><input id="rOff" value="${esc(r.dayoff_note||'')}" placeholder="напр. п'ятниця">

   <label>Технічний стан авто (1–5)</label>

   <div id="tnBox" class="${r.tech_score&&r.tech_score<=3?'':'hidden'}"><label>Що саме сталось? (обов'язково при оцінці ≤3)</label><textarea id="rTN">${esc(r.tech_note||'')}</textarea></div>
   <button class="btn" id="rSave">Надіслати звіт</button></div>`;
  let plan = r.plan12 ?? null;
  const upd = () => { $('#curbBox').classList.toggle('hidden', !(parseFloat($('#rOther').value)>0)); };
  $('#rOther').oninput = upd; upd();
  $('#pSeg').onclick = e => { const v = e.target.dataset.v; if (v===undefined) return; plan = v==='1';

// ---------- МЕНЕДЖЕР: СЬОГОДНІ ----------
m_today(el){
  const act = S.drivers.filter(d=>d.status==='active');
  const t = todayStr(), y = ymd(addDays(new Date(),-1)), days = weekDays(0);
  const pend = S.profiles.filter(p=>p.role==='driver' && p.status==='pending');
  const rows = act.map(dr => { const {reps,w} = weekRow(dr,days); return {dr, w, reps, td:effDay(dr.id,t), rep:S.reports.find(r=>r.driver_id===dr.id && r.report_date===t)}; });
  const missingY = act.filter(d=>!S.reports.some(r=>r.driver_id===d.id && r.report_date===y));
  const diffs = rows.reduce((a,x)=>a+x.reps.filter(r=>r.diff).length,0);
  const docBad = docItems().filter(x=>x.left!=null && x.left<=30);
  const incOpen = S.incidents.filter(i=>i.status==='new'||i.status==='review');
  const debtTotal = act.reduce((a,d)=>a+Math.max(0,debtBalance(S.debts.filter(x=>x.driver_id===d.id))),0);
  const todayGross = rows.reduce((a,x)=>a+(x.td?repGross(x.td):0),0);
  const weekGross = rows.reduce((a,x)=>a+x.w.gross,0), weekPay = rows.reduce((a,x)=>a+x.w.total,0);
  const subm = rows.filter(x=>x.rep).length;
  const att = [];
  const noPlanDrv = S.drivers.filter(d=>d.status==='active' && !d.plan_letter);
  if (noPlanDrv.length) att.push(['bad','🔤',`Водії без плану виплат (літери): ${noPlanDrv.length}`, noPlanDrv.slice(0,5).map(d=>d.full_name).join(', ')+'. Виплата не рахується, поки ви не оберете літеру в картці водія','m_drv']);
  if (pend.length) att.push(['warn','🆕',`Нових заявок водіїв: ${pend.length}`,'Відкрийте «Водії»: там призначите літеру й авто','m_drv']);
  if (missingY.length) att.push(['bad','📋',`Не подали звіт за вчора (${dm(y)}): ${missingY.length}`, missingY.slice(0,5).map(d=>d.full_name).join(', ')+(missingY.length>5?'…':''),'m_rep']);
  if (diffs) att.push(['warn','⚖️',`Розбіжності з Bolt/Uklon: ${diffs}`,'Водії вказали інші суми, ніж у системі. Перевірте у «Звітах»','m_rep']);
  if (docBad.length) att.push([docBad.some(x=>x.left<0)?'bad':'warn','📅',`Документи: ${docBad.length} прострочено або спливають за 30 днів`, docBad.slice(0,4).map(x=>`${x.car.plate} ${x.label.toLowerCase()}`).join(', '),'m_docs']);
  if (incOpen.length) att.push(['bad','⚠️',`ДТП і пошкодження без рішення: ${incOpen.length}`,'Відкрийте вкладку «ДТП»','m_inc']);
  if (debtTotal>0) att.push(['warn','💸',`Борги водіїв: ${money(debtTotal)}`,'Деталі в картках водіїв','m_drv']);
  const setup = [S.cars.length>0, S.drivers.length>0, S.drivers.some(d=>carOf(d.id)), Object.keys(S.apiMap||{}).length>0];
  const step = (ok,t,tab,hint) => `<div class="row" style="align-items:flex-start"><span><b>${ok?'✅':'⬜'} ${t}</b><div class="muted">${hint}</div></span><a data-go="${tab}" class="pill y" style="cursor:pointer;white-space:nowrap">відкрити</a></div>`;
  const guide = setup.every(Boolean) ? '' : `<div class="card"><h2>З чого почати</h2>
   ${step(S.cars.length>0,`Авто в парку: ${S.cars.length}`,'m_cars','«Парк»: додайте авто або імпортуйте номери з дашборду.')}
   ${step(S.drivers.length>0,`Водії в базі: ${S.drivers.length}`,'m_drv','«Водії»: додайте водія або підтвердіть заявку.')}
   ${step(S.drivers.some(d=>carOf(d.id)),`Водіїв з авто: ${S.drivers.filter(d=>carOf(d.id)).length}`,'m_drv','У картці водія виберіть авто зі списку.')}
   ${step(Object.keys(S.apiMap||{}).length>0,'Дані Bolt/Uklon у кабінеті','m_pay','У дашборді: «Аналіз за тиждень» → «Опублікувати тиждень водіям».')}</div>`;
  el.innerHTML = `
   <div class="kpis">
    <div class="kpi"><div class="l">Оборот сьогодні</div><div class="v">${money(todayGross)}</div><div class="s">${rows.filter(x=>x.td).length} водіїв з даними</div></div>
    <div class="kpi"><div class="l">Оборот за тиждень</div><div class="v">${money(weekGross)}</div><div class="s">${act.length} активних водіїв</div></div>
    <div class="kpi good"><div class="l">Нараховано водіям</div><div class="v">${money(weekPay)}</div><div class="s">за цей тиждень</div></div>
    <div class="kpi ${missingY.length?'warn':''}"><div class="l">Звіти сьогодні</div><div class="v">${subm} / ${act.length}</div><div class="s">подали</div></div>
    <div class="kpi ${debtTotal>0?'bad':''}"><div class="l">Борги</div><div class="v">${money(debtTotal)}</div><div class="s">всього по водіях</div></div>
   </div>
   <div class="cols"><div>
    <div class="card"><h2>Потрібна увага</h2>${att.length ? att.map(a=>`<div class="attn ${a[0]}" data-go="${a[4]}"><span class="ic">${a[1]}</span><div style="pointer-events:none"><b>${a[2]}</b><span>${esc(a[3])}</span></div></div>`).join('') : '<div class="muted">Усе спокійно 👍</div>'}</div>
    ${guide}
   </div><div>
    <div class="card tblwrap"><h2>Водії: сьогодні і тиждень</h2>
     <table class="tbl"><thead><tr><th>Водій</th><th class="r">Сьогодні</th><th class="r">Тиждень</th><th class="r">Нараховано</th><th>Звіт</th></tr></thead><tbody>
     ${rows.sort((a,b)=>b.w.gross-a.w.gross).map(x=>`<tr class="clk" data-open="${x.dr.id}"><td><b>${esc(x.dr.full_name)}</b><div class="muted">${esc(carOf(x.dr.id)?.plate||'без авто')} · ${esc(planLabel(x.dr))}</div></td>
       <td class="r num">${x.td?money(repGross(x.td)):'—'}</td><td class="r num">${money(x.w.gross)}</td><td class="r num">${money(x.w.total)}</td>
       <td>${x.rep?'<span class="pill g">подав</span>':'<span class="pill r">немає</span>'}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Активних водіїв ще немає</td></tr>'}
     </tbody></table></div>
   </div></div>`;
  el.onclick = async e => {
    const open = e.target.closest('[data-open]'); if (open) { S.drvOpen = open.dataset.open; S.tab = 'm_drv'; render(); window.scrollTo(0,0); return; }
    const go = e.target.closest('[data-go]');
    if (go) { const g = go.dataset.go; S.tab = g; render(); window.scrollTo(0,0); return; }
  };
},

   ${ed?`<div class="card" style="border:2px solid var(--amber)"><h2>Брендування: ${esc(ed.dr.full_name)}</h2>
     <div class="muted">Авто: <b>${money(ed.br.auto)}</b>${ed.br.pct?` (${ed.br.pct}% від отриманого)`:''}${ed.br.plate?` · ${esc(ed.br.plate)}`:''}. Якщо вписати суму нижче, вона замінить автоматичну.</div>

     <label style="display:flex;gap:8px;align-items:center;margin-top:10px;text-transform:none;letter-spacing:0"><input type="checkbox" id="bSkip" ${ed.br.skip?'checked':''} style="width:auto;margin:0"> Не платити брендування цьому водієві за цей тиждень</label>
     <div style="margin-top:12px;display:flex;gap:8px"><button class="btn sm" id="bSave">Зберегти</button><button class="btn sm sec" id="bCancel">Скасувати</button></div></div>`:''}
   <div class="kpis">
    <div class="kpi"><div class="l">Оборот</div><div class="v">${money(sum(x=>x.w.gross))}</div></div>
    <div class="kpi good"><div class="l">Нараховано</div><div class="v">${money(sum(x=>x.tot))}</div><div class="s">${useBrand?(loaded?'з мийкою і брендуванням':'з мийкою, без брендування'):'з урахуванням мийки'}</div></div>

   <div class="card tblwrap"><table class="tbl"><thead><tr><th>Водій</th><th>План</th><th class="r">Оборот</th><th class="r">%</th><th class="r">За відсотки</th><th class="r">Мийка</th>${useBrand?'<th class="r">Брендування</th>':''}<th class="r">Нараховано</th><th class="r">Борг</th><th>Виплата</th></tr></thead><tbody>

     ${useBrand?`<td class="r num">${loaded?`<a class="lnk noprint" data-brand="${x.dr.id}" title="Змінити або не платити">${x.br.eff>0||x.br.skip||x.br.manual!=null?money(x.br.eff):'—'}</a><div>${brandPill(x.br)}</div>${x.br.plate?`<div class="muted">${esc(x.br.plate)}</div>`:''}`:'<span class="muted" title="Ще не завантажено">⏳</span>'}</td>`:''}
     <td class="r num"><b>${money(tot)}</b></td><td class="r num" style="${x.bal>0?'color:var(--bad)':''}">${x.bal?money(x.bal):'—'}</td>
     <td>${po?`<span class="pill g">✓ ${fmtDate((po.paid_at||po.created_at||ws).slice(0,10))}</span> <span class="num">${money(po.amount)}</span>${needBrandPay?` <button class="btn sm noprint" data-paybrand="${x.dr.id}">＋ брендування ${money(x.br.eff)}</button>`:(Math.abs(po.amount-tot)>1?` <span class="pill y" title="Після виплати цифри змінились">тепер ${money(tot)}</span>`:'')} <a class="lnk noprint" data-unpay="${x.dr.id}">скасувати</a>`:(x.w.noPlan?'<span class="pill r">оберіть літеру</span>':(tot>0?`<button class="btn sm noprint" data-pay="${x.dr.id}">${waitBrand?'Без брендування':'Виплатити'}</button>`:'<span class="muted">—</span>'))}</td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">Активних водіїв немає</td></tr>'}
   </tbody><tfoot><tr><td colspan="2">Разом</td><td class="r num">${money(sum(x=>x.w.gross))}</td><td></td><td class="r num">${money(sum(x=>x.w.share))}</td><td class="r num">${money(sum(x=>x.w.washBack))}</td>${useBrand?`<td class="r num">${loaded?money(sum(x=>x.bAdd)):'—'}</td>`:''}<td class="r num">${money(sum(x=>x.tot))}</td><td class="r num">${money(sum(x=>Math.max(0,x.bal)))}</td><td></td></tr></tfoot></table></div>
   <div class="muted">Виплата рахується за планом (літерою) кожного водія з вкладки «Умови». Брендування на відсоток не впливає: водій отримує свою частку (зазвичай 50%) від отриманої суми окремим рядком. Натисніть на суму брендування, щоб виправити її вручну або не платити. «Борг» окремо, з виплати він автоматично не віднімається.</div>`);
  const msg = (t,ok) => { $('#pmsg').innerHTML = `<div class="${ok?'ok':'err'}">${esc(t)}</div>`; };
  const markBrandPaid = async (ids, paid) => { if (!useBrand || !loaded) return; for (const id of ids) await db.from('brand_weeks').update({paid_at: paid ? new Date().toISOString() : null}).eq('driver_id',id).eq('week_start',ws); };
  if (ed) { $('#bCancel').onclick = () => { S.brandEdit = null; render(); };
    $('#bSave').onclick = async () => { const mv = $('#bMan').value.trim();
      const r = await db.from('brand_weeks').upsert({driver_id:ed.dr.id, week_start:ws, manual_amount: mv===''?null:+mv, skip:$('#bSkip').checked, note:$('#bNote').value.trim()||null, updated_at:new Date().toISOString()},{onConflict:'driver_id,week_start'});
      if (r.error) return msg(r.error.message); S.brandEdit = null; await load(); render(); }; }
  el.onclick = async e => {

      const head = ['Водій','Авто','План','Оборот','Відсоток','За відсотки','Мийка','Брендування','Нараховано','Борг','Виплачено','Дата виплати'];
      const lines = [head].concat(data.map(x=>[x.dr.full_name, x.car?.plate||'', planLabel(x.dr), Math.round(x.w.gross), x.w.pct, Math.round(x.w.share), Math.round(x.w.washBack), Math.round(x.bAdd), x.tot, Math.round(x.bal), x.po?Math.round(x.po.amount):'', x.po?fmtDate((x.po.paid_at||x.po.created_at||ws).slice(0,10)):'']));
      const csv = '﻿' + lines.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = `vidomist_${ws}.csv`; document.body.appendChild(a); a.click(); a.remove(); return; }
    if (t.id==='pPrint') { window.print(); return; }
    if (t.id==='pAll') { if (!confirm(`Позначити виплаченими ${todo.length} водіїв на суму ${money(todo.reduce((a,x)=>a+x.tot,0))}?${waitBrand?'\nБрендування ще не завантажено, воно буде виплачено окремо.':''}`)) return;
      const r = await db.from('payouts').upsert(todo.map(x=>({driver_id:x.dr.id, week_start:ws, amount:x.tot})),{onConflict:'driver_id,week_start'}); if (r.error) return msg(r.error.message);
      await markBrandPaid(todo.filter(x=>x.br.eff>0).map(x=>x.dr.id), true); await load(); render(); return; }
    const brandId = t.dataset.brand;
    if (brandId) { S.brandEdit = brandId; render(); window.scrollTo(0,0); return; }
    const pay = t.dataset.pay, unpay = t.dataset.unpay, payBrand = t.dataset.paybrand;
    if (pay) { const x = data.find(y=>y.dr.id===pay); const note = prompt(`Виплата: ${x.dr.full_name}, ${money(x.tot)}${waitBrand?' (без брендування)':''}.\nКоментар (необов'язково):`, ''); if (note===null) return;
      const r = await db.from('payouts').upsert({driver_id:pay, week_start:ws, amount:x.tot, note:note||null},{onConflict:'driver_id,week_start'}); if (r.error) return msg(r.error.message);
      if (x.br.eff>0) await markBrandPaid([pay], true); await load(); render(); return; }
    if (payBrand) { const x = data.find(y=>y.dr.id===payBrand); if (!confirm(`Виплатити брендування ${money(x.br.eff)} водієві ${x.dr.full_name}?`)) return;
      const r = await db.from('payouts').upsert({driver_id:payBrand, week_start:ws, amount:x.tot, note:'+ брендування'},{onConflict:'driver_id,week_start'}); if (r.error) return msg(r.error.message);
      await markBrandPaid([payBrand], true); await load(); render(); return; }
    if (unpay) { if (!confirm('Скасувати позначку «Виплачено»?')) return; const r = await db.from('payouts').delete().eq('driver_id',unpay).eq('week_start',ws); if (r.error) return msg(r.error.message); await markBrandPaid([unpay], false); await load(); render(); return; }
    const open = t.closest('[data-open]'); if (open) { S.drvOpen = open.dataset.open; S.tab = 'm_drv'; render(); window.scrollTo(0,0); }
  };
},

// ---------- МЕНЕДЖЕР: ДОКУМЕНТИ ----------
m_docs(el){
  const all = docItems();
  const f = S.docFilter || 'all';
  const cnt = { bad: all.filter(x=>x.left!=null && x.left<0).length, soon: all.filter(x=>x.left!=null && x.left>=0 && x.left<=30).length, none: all.filter(x=>x.left==null).length };
  let list = all.slice();
  if (f==='bad') list = list.filter(x=>x.left!=null && x.left<0); else if (f==='soon') list = list.filter(x=>x.left!=null && x.left<=30); else if (f==='none') list = list.filter(x=>x.left==null);
  list.sort((a,b)=>(a.left==null)-(b.left==null) || (a.left??0)-(b.left??0));
  el.innerHTML = `<div id="xmsg"></div>

     return `<tr><td><b>${esc(dr.full_name)}</b><div class="muted">${esc(carOf(dr.id)?.plate||'без авто')} · ${dr.plan_letter?esc(dr.plan_letter):'<b style="color:var(--bad)">⚠ без плану</b>'}</div></td>
      ${days.map(d=>{const r=reps.find(x=>x.report_date===d); return `<td>${r?`<a data-eff="${dr.id}|${d}" style="cursor:pointer"><b class="num">${money(repGross(r))}</b>${r.diff?' <span class="pill r">≠</span>':(r.src==='driver'?' <span class="pill y">в.</span>':'')}${r.rep&&r.rep.plan12===false?' <span class="pill r">план</span>':''}${!r.rep?' <span class="muted" title="звіт ще не подано">●</span>':''}</a>`:(d<=todayStr()?`<a data-addrep="${dr.id}|${d}" style="cursor:pointer;color:var(--muted)">＋</a>`:'')}</td>`}).join('')}
      <td><b class="num">${money(w.gross)}</b></td><td><b class="num">${money(w.total)}</b><div class="muted">${w.pct}%</div></td></tr>`;}).join('')}</tbody></table></div><div id="repDetail"></div>`);

    $('#repDetail').innerHTML = `<div class="card"><h2>${esc(dr.full_name)} · ${dayName(edate)} ${dm(edate)} ${srcPill(ef)}</h2>
      <div class="row"><span>З системи (Bolt / Uklon)</span><b>${ap?`${money(ap.bolt_net)} / ${money(ap.uklon_net)}`:'немає даних'}</b></div>
      <div class="row"><span>Подав водій (Bolt / Uklon / Інше)</span><b>${r?`${money(r.bolt)} / ${money(r.uklon)} / ${money(r.other)}`:'звіт не подано'}</b></div>
      ${ef.diff?`<div class="err" style="margin-top:8px">Суми водія не збігаються з системою. Зараз в розрахунку дані системи.</div><button class="btn sm grn" data-acc="${r.id}|1">Прийняти варіант водія</button>`:''}
      ${r&&r.accepted?`<button class="btn sm sec" data-acc="${r.id}|0">Повернути на дані системи</button>`:''}
      ${r?`<div class="row"><span>Км (по бордюрах)</span><b>${r.km??'—'} (${r.curb_km??'—'})</b></div>
      <div class="row"><span>Поїздок</span><b>${r.trips??'—'}</b></div>
      <div class="row"><span>Мийка</span><b>${money(r.wash)}</b></div>
      <div class="row"><span>План 12 год</span><b>${r.plan12?'так':'ні'}</b></div>${r.plan_comment?`<div class="muted">Пояснення: ${esc(r.plan_comment)}</div>`:''}
      <div class="row"><span>Вихідний / вихід завтра</span><b>${esc(r.dayoff_note||'—')} / ${esc(r.next_start||'—')}</b></div>

      .sort((a,b)=>a.full_name.localeCompare(b.full_name));
    $('#dlist').innerHTML = `<div class="card tblwrap"><table class="tbl"><thead><tr><th>Водій</th><th>Авто</th><th>План</th><th class="r">Оборот тижня</th><th class="r">Борг</th><th>Акаунт</th></tr></thead><tbody>
     ${list.map(dr=>{ const {w} = weekRow(dr,days); const bal = debtBalance(S.debts.filter(x=>x.driver_id===dr.id)); const acc = hasAcc(dr.id);
       return `<tr class="clk" data-open="${dr.id}" style="${dr.status==='archived'?'opacity:.55':''}"><td><b>${esc(dr.full_name)}</b><div class="muted">${esc(dr.phone||'')}${dr.dash_name?` · ${esc(dr.dash_name)}`:''}</div></td>
       <td>${esc(carOf(dr.id)?.plate||'—')}</td><td>${esc(planLabel(dr))}</td><td class="r num">${money(w.gross)}</td><td class="r num" style="${bal>0?'color:var(--bad)':''}">${bal?money(bal):'—'}</td>

m_cars(el){

    ${[['all','Усі'],['drv','З водієм'],['free','Вільні'],['docs','Потрібні документи']].map(([k,l])=>`<span class="chip ${f===k?'on':''}" data-f="${k}">${l}</span>`).join('')}<span style="flex:1"></span>
    <button class="btn sm sec" id="cImp">⬇ Імпорт номерів з дашборду</button><button class="btn sm" id="cToggle">＋ Додати авто</button></div>

     <div><label>Номер</label><input id="cPlate" placeholder="ВС0000АА"></div><div><label>Марка / модель</label><input id="cModel" placeholder="Toyota Camry"></div>

   <div class="card" style="padding:0"><div style="overflow-x:auto"><table class="tbl" style="min-width:900px"><thead><tr><th>Номер</th><th>Модель</th><th>Паливо</th><th>Водій</th><th>Страховка</th><th>Техогляд</th><th>Ліцензія</th><th></th></tr></thead><tbody>
   ${list.map(c=>`<tr><td><b>${esc(c.plate)}</b></td>

    await load(); if (t.dataset.cf) render(); };

    return `<div style="padding:12px 0;border-top:1px solid var(--line)"><div class="row" style="align-items:flex-start;border:0;padding:0"><div><b>${esc(dr?.full_name||'—')}</b> <span class="pill">${i.kind==='self_damage'?'самост. пошкодження':'ДТП'}</span>

    const id = e.target.dataset.delinc; if (!id) return; if (!confirm('Видалити це звернення разом з фото?')) return;
    const paths = (S.media[id]||[]).map(m=>m.storage_path); if (paths.length) await db.storage.from('incident-media').remove(paths).catch(()=>{});
    const r = await db.from('incidents').delete().eq('id',id); if (r.error) return alert(r.error.message); await load(); render(); };
  el.onchange = async e => { const id = e.target.dataset.is; if (!id) return; const r = await db.from('incidents').update({status:e.target.value}).eq('id',id); if (r.error) alert(r.error.message); else { await load(); render(); } };
},

// ---------- МЕНЕДЖЕР: УМОВИ ----------
m_set(el){
  const s = S.settings;
  const plans = JSON.parse(JSON.stringify(plansList()));
  const usedBy = code => S.drivers.filter(d=>d.plan_letter===code).length;
  const tierRow = (pi, ti, t, first) => `<div class="row" style="gap:6px"><span>від <input inputmode="decimal" data-pf="${pi}|${ti}" value="${t.from}" ${first?'disabled':''} style="width:92px;margin:0;display:inline-block;text-align:right"> ₴</span>
     <span><input inputmode="decimal" data-pp="${pi}|${ti}" value="${t.pct}" style="width:64px;margin:0;display:inline-block;text-align:right"> % ${first?'':`<a data-dt="${pi}|${ti}" style="cursor:pointer;color:var(--danger);margin-left:6px">✕</a>`}</span></div>`;
  const planCard = (p, pi) => `<div style="border-top:1px solid var(--line);padding:12px 0">
    <div class="row" style="gap:8px"><span><b>Літера ${esc(p.code)}</b></span><span class="muted">${usedBy(p.code)} водіїв</span></div>
    <label>Назва</label><input data-pn="${pi}" value="${esc(p.name)}">
    <label>Рахувати відсоток</label><select data-pper="${pi}"><option value="day" ${p.period==='day'?'selected':''}>за добу (кожен день окремо)</option><option value="week" ${p.period==='week'?'selected':''}>за тиждень (на весь тиждень)</option></select>
    <div class="muted" style="margin-top:6px">${p.period==='week'?'Оборот за тиждень → відсоток на весь тиждень':'Оборот за день → відсоток за цей день'}</div>
    ${p.tiers.map((t,ti)=>tierRow(pi,ti,t,ti===0)).join('')}
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm sec" data-at="${pi}">＋ Сходинка</button>${usedBy(p.code)?'':`<button class="btn sm red" data-dp="${pi}">Видалити план</button>`}</div></div>`;
  const draw = () => {
    el.innerHTML = `<div class="card"><h2>Умови виплат</h2><div id="smsg"></div>
     ${S.plansMissing?'<div class="err">Таблиці планів у базі ще немає: запустіть pay_plans.sql у Supabase (інструкція в чаті). Поки що працюють стандартні плани, а зберегти зміни не вийде.</div>':''}
     <div class="muted">Тут задаються плани виплати. Кожен водій має свою літеру (картка водія → «Водії»). Сходинка «від 30000 → 60%» означає: якщо оборот ≥ 30 000, то 60%. «За добу» дивиться на оборот кожного дня, «за тиждень» дивиться на оборот усього тижня і рахує відсоток на весь тиждень.</div>
     ${plans.map(planCard).join('')}
     <div style="border-top:1px solid var(--line);padding:12px 0"><b>Новий план</b><div class="two"><div><label>Літера / код</label><input id="npCode" maxlength="3" placeholder="напр. Т"></div><div><label>Назва</label><input id="npName" placeholder="напр. Тижневий"></div></div><button class="btn sm sec" id="npAdd" style="margin-top:8px">＋ Додати план</button></div>
     <div style="border-top:1px solid var(--line);padding:12px 0"><b>Мийка</b><div class="row"><span>повернення за мийку на тиждень, ₴</span><span><input inputmode="decimal" id="washIn" value="${s.wash_week}" style="width:88px;margin:0;display:inline-block;text-align:right"></span></div></div>
     <button class="btn" id="sSave">Зберегти все</button></div>`;
  };
  const read = () => {   // зчитати поля в plans
    el.querySelectorAll('[data-pn]').forEach(i=>{ plans[+i.dataset.pn].name = i.value.trim(); });
    el.querySelectorAll('[data-pper]').forEach(i=>{ plans[+i.dataset.pper].period = i.value; });
    el.querySelectorAll('[data-pf]').forEach(i=>{ const [a,b]=i.dataset.pf.split('|'); plans[+a].tiers[+b].from = parseFloat(String(i.value).replace(',','.')); });
    el.querySelectorAll('[data-pp]').forEach(i=>{ const [a,b]=i.dataset.pp.split('|'); plans[+a].tiers[+b].pct = parseFloat(String(i.value).replace(',','.')); });
  };
  const err = t => { $('#smsg').innerHTML = `<div class="err">${esc(t)}</div>`; window.scrollTo(0,0); };
  draw();
  el.onchange = e => { if (e.target.dataset.pper !== undefined) { read(); draw(); } };
  el.onclick = async e => {
    const t = e.target;
    if (t.dataset.at !== undefined) { read(); const p = plans[+t.dataset.at]; const last = p.tiers[p.tiers.length-1]; p.tiers.push({from:(last?last.from:0)+1000, pct:last?last.pct:50}); draw(); return; }
    if (t.dataset.dt !== undefined) { read(); const [a,b]=t.dataset.dt.split('|'); plans[+a].tiers.splice(+b,1); draw(); return; }
    if (t.dataset.dp !== undefined) { if (!confirm('Видалити цей план?')) return; read(); const p = plans[+t.dataset.dp];
      const r = await db.from('pay_plans').delete().eq('code', p.code); if (r.error) return err(r.error.message);
      plans.splice(+t.dataset.dp,1); await load(); VIEWS.m_set(el); return; }
    if (t.id === 'npAdd') { read(); const code = $('#npCode').value.trim(), name = $('#npName').value.trim();
      if (!code) return err('Впишіть літеру або код плану');
      if (plans.some(p=>p.code.toLowerCase()===code.toLowerCase())) return err('План з такою літерою вже є');
      plans.push({code, name: name||code, period:'day', tiers:[{from:0,pct:50},{from:3000,pct:55}]}); draw(); return; }
    if (t.id === 'sSave') { read();
      const wash = parseFloat(String($('#washIn').value).replace(',','.')); if (isNaN(wash)||wash<0) return err('Мийка: число від 0');
      for (const p of plans) {
        if (!p.tiers.length || p.tiers.some(x=>isNaN(x.from)||isNaN(x.pct))) return err(`План ${p.code}: заповніть усі суми й відсотки числами`);
        if (p.tiers.some(x=>x.pct<0||x.pct>100||x.from<0)) return err(`План ${p.code}: відсоток від 0 до 100, суми не від'ємні`);
        p.tiers[0].from = 0;
        for (let i=1;i<p.tiers.length;i++) if (p.tiers[i].from <= p.tiers[i-1].from) return err(`План ${p.code}: суми мають зростати зверху вниз`);
      }
      const rows = plans.map((p,i)=>({code:p.code, name:p.name, period:p.period, tiers:p.tiers, sort:i}));
      let r = await db.from('pay_plans').upsert(rows,{onConflict:'code'}); if (r.error) return err(r.error.message);
      r = await db.from('settings').upsert([{key:'wash_week', value:wash}],{onConflict:'key'}); if (r.error) return err(r.error.message);
      await load(); VIEWS.m_set(el); $('#smsg').innerHTML='<div class="ok">Збережено</div>'; }
  };
}
};
const carOf = did => S.cars.find(c=>c.driver_id===did);

// ---------- ДТП: форма + список (водій) ----------
const INC_ST = {new:'🆕 Нове', review:'🔎 В роботі', resolved:'✅ Вирішено', rejected:'⛔ Відхилено'};
const incSt = s => INC_ST[s] || s;
const mediaBox = id => (S.media && S.media[id] && S.media[id].length) ? `<div class="media" data-media="${id}" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><span class="muted">Завантажую фото…</span></div>` : '';
async function fillMedia(root){
  for (const box of root.querySelectorAll('[data-media]')) {
    const list = S.media[box.dataset.media] || [];
    const r = await db.storage.from('incident-media').createSignedUrls(list.map(m=>m.storage_path), 3600);
    if (r.error || !r.data) { box.innerHTML = '<span class="muted">Не вдалось відкрити фото: '+esc(r.error?.message||'')+'</span>'; continue; }
    box.innerHTML = r.data.map((x,i) => !x.signedUrl ? '' : (list[i].kind==='video'
      ? `<a href="${x.signedUrl}" target="_blank" class="pill">🎬 відео ${i+1}</a>`
      : `<a href="${x.signedUrl}" target="_blank"><img src="${x.signedUrl}" style="width:110px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></a>`)).join('') || '<span class="muted">Файлів немає</span>';
  }
}
function incidentForm(el, driverId, list){
  el.innerHTML = `<div class="card"><h2>Повідомити про подію</h2><div id="imsg"></div>
   <div class="seg" id="iKind"><button type="button" data-v="dtp" class="on">ДТП</button><button type="button" data-v="self_damage">Самостійне пошкодження</button></div>
   <label>Де сталось</label><input id="iLoc"><label>Що сталось</label><textarea id="iDesc"></textarea>
   <label>Фото / відео</label><input id="iFiles" type="file" accept="image/*,video/*" multiple capture="environment">
   <button class="btn" id="iSend">Надіслати</button></div>
   <div class="card"><h2>Мої звернення</h2>${list.map(i=>`<div class="row"><div><b>${i.kind==='self_damage'?'Самост. пошкодження':'ДТП'}</b><div class="muted">${i.created_at.slice(0,10)} · ${esc(i.location||'')}</div></div><span class="pill">${esc(incSt(i.status))}</span></div>${mediaBox(i.id)}`).join('') || '<div class="muted">Звернень немає</div>'}</div>`;
  fillMedia(el);
  let kind = 'dtp';
  $('#iKind').onclick = e => { const v = e.target.dataset.v; if (!v) return; kind = v; document.querySelectorAll('#iKind button').forEach(b=>b.classList.toggle('on', b.dataset.v===v)); };
  $('#iSend').onclick = async () => {
    const m = (t,ok) => $('#imsg').innerHTML = `<div class="${ok?'ok':'err'}">${esc(t)}</div>`;
    const desc = $('#iDesc').value.trim(); if (!desc) return m('Опишіть, що сталось');
    $('#iSend').disabled = true;
    const {data:inc, error} = await db.from('incidents').insert({driver_id:driverId, kind, location:$('#iLoc').value.trim()||null, description:desc, occurred_at:new Date().toISOString()}).select().single();
    if (error) { $('#iSend').disabled=false; return m('Помилка: '+error.message); }
    let fail = 0;
    for (const f of $('#iFiles').files) {
      const path = `${driverId}/${inc.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;
      const up = await db.storage.from('incident-media').upload(path, f);
      if (up.error) { fail++; continue; }
      await db.from('incident_media').insert({incident_id:inc.id, driver_id:driverId, storage_path:path, kind:f.type.startsWith('video')?'video':'photo'});
    }
    await load(); render(); $('#imsg').innerHTML = `<div class="${fail?'err':'ok'}">${fail?`Звернення надіслано, але ${fail} файл(ів) не завантажилось`:'Звернення надіслано менеджеру'}</div>`;
  };
}

// ====================== СТАРТ ======================
(function init(){
  if (!window.supabase) { document.body.innerHTML = '<p style="padding:24px">Не вдалося завантажити додаток. Перевірте інтернет і оновіть сторінку.</p>'; return; }
  // Всередині дашборда — спільна сесія з дашбордом (менеджер).
  // Окрема сторінка driver.html (водії) — власне сховище, щоб вхід водія НЕ підміняв сесію менеджера.
  db = EMBED ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
             : supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{storageKey:'sb-driver-cabinet-auth'}});
  setAuthMode(false);
  db.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') { recovering = true; showOnly('recov'); } if (ev === 'SIGNED_OUT') { showOnly('auth'); } });
  if (/type=recovery/.test(location.hash)) recovering = true;
  boot().catch(e => { showOnly('auth'); authMsg('Помилка: '+e.message); });
})();
</script>
